<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Exam Simulator</title>
    <!-- Apply the saved theme before first paint so there is no white flash -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('gate_theme') || 'system';
                var t = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css?v=16">

    <!-- MathJax: the app turns Obsidian's $...$ and $$...$$ into \( \) and \[ \] itself, so stray dollar signs in text are never treated as math -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true,
                packages: { '[+]': ['mathtools', 'gensymb', 'upgreek', 'textcomp', 'textmacros', 'centernot', 'cases'] }
            },
            loader: { load: ['[tex]/mathtools', '[tex]/gensymb', '[tex]/upgreek', '[tex]/textcomp', '[tex]/textmacros', '[tex]/centernot', '[tex]/cases'] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
            startup: { typeset: false } // app.js typesets each question after rendering it
        };
    </script>
    <!-- Load MathJax from CDN -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body>
    <div id="nav">
        <div class="nav-brand">
            <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M1 9C5 -1 9 -1 13 9S21 19 25 9"/></svg>
            <span>GATE Simulator</span>
        </div>
        <div class="nav-links" role="tablist">
            <button class="nav-btn active" data-view="exam">Simulator</button>
            <button class="nav-btn" data-view="dashboard">Dashboard</button>
            <button class="nav-btn" data-view="settings">Settings</button>
        </div>
        <div class="nav-right">
            <div class="theme-wrap">
                <button id="theme-btn" class="theme-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Change theme"></button>
                <div id="theme-menu" class="theme-menu" role="menu" aria-label="Theme" hidden></div>
            </div>
        </div>
    </div>
    
    <div id="workspace">
        <div id="view-exam" class="view-container active">
            <div class="view-header"></div>
            <div class="view-content">
                <!-- Shown instantly, before any script runs; app.js replaces it with the live progress screen -->
                <div class="gate-view-container"><div class="gate-loading-card" role="status">
                    <div class="gate-spinner" aria-hidden="true"></div>
                    <h3>Loading your questions</h3>
                    <div class="gate-loading-step">Starting&hellip;</div>
                    <div class="gate-progress"><div class="gate-progress-fill" style="width:6%"></div></div>
                    <div class="gate-loading-hint">The first visit downloads every paper, so it takes a little longer. Once loaded, switching tabs is instant.</div>
                </div></div>
                <noscript><p style="padding:20px">This simulator needs JavaScript enabled.</p></noscript>
            </div>
        </div>
        <div id="view-dashboard" class="view-container">
            <div class="view-header"></div>
            <div class="view-content"></div>
        </div>
        <div id="view-settings" class="view-container">
            <div class="view-header"></div>
            <div class="view-content"></div>
        </div>
    </div>

    <script src="app.js?v=16"></script>
</body>
</html>
