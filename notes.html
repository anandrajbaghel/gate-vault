<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notes &middot; GATE Vault</title>
    <!-- Apply the saved theme before first paint (same key as the simulator) -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('gate_theme') || 'system';
                var t = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <!-- Theme tokens, buttons, switches, callouts and code styling are shared with the simulator -->
    <link rel="stylesheet" href="styles.css?v=16">
    <link rel="stylesheet" href="web-script/notes/notes.css?v=2">

    <!-- MathJax: same setup as the simulator. The reader turns $...$ / $$...$$ into \( \) / \[ \] itself. -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true,
                packages: { '[+]': ['mathtools', 'gensymb', 'upgreek', 'textcomp', 'textmacros', 'centernot', 'cases'] }
            },
            loader: { load: ['[tex]/mathtools', '[tex]/gensymb', '[tex]/upgreek', '[tex]/textcomp', '[tex]/textmacros', '[tex]/centernot', '[tex]/cases'] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body class="gn-page">
    <div id="nav">
        <div class="nav-brand">
            <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M1 9C5 -1 9 -1 13 9S21 19 25 9"/></svg>
            <span>GATE Simulator</span>
        </div>
        <div class="nav-links">
            <a class="nav-btn" href="./">Simulator</a>
            <a class="nav-btn active" href="notes.html" aria-current="page">Notes</a>
        </div>
        <div class="nav-right gn-nav-right">
            <button id="gn-toggle-left" class="gn-icon-btn" type="button" aria-label="Toggle file list" title="File list">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z"/><path d="M9 3v18"/></svg>
            </button>
            <button id="gn-toggle-right" class="gn-icon-btn" type="button" aria-label="Toggle outline and links" title="Outline and links">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z"/><path d="M15 3v18"/></svg>
            </button>
            <button id="gn-search-btn" class="gn-icon-btn" type="button" aria-label="Search notes" title="Open a note (Ctrl/Cmd+O)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.3-4.3"/></svg>
            </button>
            <button id="gn-settings-btn" class="gn-icon-btn" type="button" aria-label="Notes settings" title="Notes settings (Ctrl/Cmd+,)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
            </button>
            <div class="theme-wrap">
                <button id="theme-btn" class="theme-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Change theme"></button>
                <div id="theme-menu" class="theme-menu" role="menu" aria-label="Theme" hidden></div>
            </div>
        </div>
    </div>

    <div id="gn-app">
        <aside id="gn-left" class="gn-side" aria-label="Files and tags"></aside>
        <div id="gn-resize-left" class="gn-resizer" role="separator" aria-orientation="vertical" aria-label="Resize file list"></div>
        <main id="gn-main">
            <!-- Replaced by app.js once the notes list has loaded -->
            <div class="gn-card" role="status"><div class="gn-spinner" aria-hidden="true"></div><h2>Loading your notes</h2><p class="gn-sub">Fetching the notes list&hellip;</p></div>
            <noscript><p style="padding:20px">The notes reader needs JavaScript enabled.</p></noscript>
        </main>
        <div id="gn-resize-right" class="gn-resizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel"></div>
        <aside id="gn-right" class="gn-side" aria-label="Outline, backlinks and links"></aside>
        <div id="gn-backdrop" class="gn-backdrop"></div>
    </div>

    <!-- Order matters: shared helpers first, then the notes modules, app.js last. -->
    <script defer src="web-script/shared/dom.js?v=2"></script>
    <script defer src="web-script/shared/theme.js?v=2"></script>
    <script defer src="web-script/shared/ui.js?v=2"></script>
    <script defer src="web-script/notes/settings.js?v=2"></script>
    <script defer src="web-script/notes/loader.js?v=2"></script>
    <script defer src="web-script/notes/index.js?v=2"></script>
    <script defer src="web-script/notes/callouts.js?v=2"></script>
    <script defer src="web-script/notes/markdown.js?v=2"></script>
    <script defer src="web-script/notes/router.js?v=2"></script>
    <script defer src="web-script/notes/explorer.js?v=2"></script>
    <script defer src="web-script/notes/panels.js?v=2"></script>
    <script defer src="web-script/notes/reader.js?v=2"></script>
    <script defer src="web-script/notes/preview.js?v=2"></script>
    <script defer src="web-script/notes/search.js?v=2"></script>
    <script defer src="web-script/notes/settings-ui.js?v=2"></script>
    <script defer src="web-script/notes/app.js?v=2"></script>
</body>
</html>
